<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="410" viewBox="0 0 1500 410" role="img" aria-labelledby="title desc">
  <title id="title">Smart Expense Tracker data flow</title>
  <desc id="desc">Expense input is validated, saved to CSV, analysed with Pandas and NumPy, then displayed as insights and charts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1932"/><stop offset="1" stop-color="#23104a"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#55efd7"/><stop offset=".5" stop-color="#7e83ff"/><stop offset="1" stop-color="#ff76b8"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1500" height="410" rx="28" fill="url(#bg)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="750" y="57" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">From a receipt to a clear decision</text>
    <text x="750" y="85" text-anchor="middle" fill="#aebedf" font-size="16">A lightweight pipeline designed for reliable daily tracking.</text>
    <path d="M210 222H1290" stroke="url(#rail)" stroke-width="7" stroke-linecap="round" opacity=".26" filter="url(#glow)"/><path d="M210 222H1290" stroke="url(#rail)" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(90 142)"><circle cx="74" cy="80" r="62" fill="#55efd7" fill-opacity=".13" stroke="#6bf7e4" stroke-opacity=".55"/><circle cx="74" cy="80" r="25" fill="#55efd7" fill-opacity=".18"/><path d="M63 80l8 8 16-18" fill="none" stroke="#76f8e5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="176" text-anchor="middle" fill="#fff" font-size="19" font-weight="750">Log</text><text x="74" y="201" text-anchor="middle" fill="#aabbd8" font-size="14">Date • amount • category</text></g>
    <g transform="translate(402 142)"><circle cx="74" cy="80" r="62" fill="#827dff" fill-opacity=".14" stroke="#aaa6ff" stroke-opacity=".55"/><rect x="51" y="49" width="46" height="60" rx="8" fill="#8d8aff" fill-opacity=".23" stroke="#c5c3ff" stroke-width="2"/><path d="M62 66h24M62 80h24M62 94h15" stroke="#dbdaff" stroke-width="3" stroke-linecap="round"/><text x="74" y="176" text-anchor="middle" fill="#fff" font-size="19" font-weight="750">Persist</text><text x="74" y="201" text-anchor="middle" fill="#aabbd8" font-size="14">Clean CSV storage</text></g>
    <g transform="translate(714 142)"><circle cx="74" cy="80" r="62" fill="#48c9ff" fill-opacity=".14" stroke="#83ddff" stroke-opacity=".55"/><path d="M48 100V76h13v24zm20 0V56h13v44zm20 0V68h13v32z" fill="#89e9ff"/><text x="74" y="176" text-anchor="middle" fill="#fff" font-size="19" font-weight="750">Analyse</text><text x="74" y="201" text-anchor="middle" fill="#aabbd8" font-size="14">Pandas + NumPy</text></g>
    <g transform="translate(1026 142)"><circle cx="74" cy="80" r="62" fill="#ff78b8" fill-opacity=".14" stroke="#ff9ecb" stroke-opacity=".55"/><path d="M48 95c16-4 19-30 34-20s19 4 31-22" fill="none" stroke="#ffb3d8" stroke-width="4" stroke-linecap="round"/><circle cx="48" cy="95" r="4" fill="#fff"/><circle cx="82" cy="75" r="4" fill="#fff"/><circle cx="113" cy="53" r="4" fill="#fff"/><text x="74" y="176" text-anchor="middle" fill="#fff" font-size="19" font-weight="750">Visualise</text><text x="74" y="201" text-anchor="middle" fill="#aabbd8" font-size="14">Charts &amp; reports</text></g>
    <g fill="#f1f6ff"><path d="M334 216l13 6-13 6zM646 216l13 6-13 6zM958 216l13 6-13 6z"/></g>
  </g>
</svg>
