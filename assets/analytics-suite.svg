      <g transform="translate(46 124)"><path d="M0 113h560M0 75h560M0 37h560" stroke="#d0ddff" stroke-opacity=".11"/><rect x="22" y="48" width="48" height="65" rx="7" fill="url(#aqua)"/><rect x="111" y="25" width="48" height="88" rx="7" fill="url(#violet)"/><rect x="200" y="61" width="48" height="52" rx="7" fill="url(#aqua)"/><rect x="289" y="7" width="48" height="106" rx="7" fill="url(#pink)"/><rect x="378" y="39" width="48" height="74" rx="7" fill="url(#violet)"/><rect x="467" y="51" width="48" height="62" rx="7" fill="url(#aqua)"/><text x="291" y="-8" text-anchor="middle" fill="#ffc2dd" font-size="13" font-weight="700">TOP</text></g>
