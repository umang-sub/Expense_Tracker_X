      <g transform="translate(31 35)"><rect width="44" height="44" rx="13" fill="#ffca66" fill-opacity=".18"/><path d="M11 31V20h6v11zm9 0V12h6v19zm9 0V17h6v14z" fill="#ffe5a4"/></g>
