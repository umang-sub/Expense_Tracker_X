<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
  <title id="title">Expense Tracker analytics suite</title>
  <desc id="desc">Four stylised cards representing bar, line, pie, and histogram visualisations available in the app.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1225"/><stop offset=".5" stop-color="#151c42"/><stop offset="1" stop-color="#261348"/></linearGradient>
    <linearGradient id="aqua" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#0ac8dd"/><stop offset="1" stop-color="#77f8ef"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#7357f6"/><stop offset="1" stop-color="#c699ff"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#e13b93"/><stop offset="1" stop-color="#ff9fcd"/></linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".36"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#d6e1ff" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1600" height="860" fill="url(#back)"/>
  <rect width="1600" height="860" fill="url(#grid)"/>
  <circle cx="150" cy="100" r="230" fill="#00d2e8" opacity=".09"/><circle cx="1450" cy="770" r="270" fill="#be4fff" opacity=".1"/>
